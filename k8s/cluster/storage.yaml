apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-mirror
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values:
          - filer
parameters:
  compression: "off"
  dedup: "off"
  fstype: zfs
  poolname: pool-mirror
  recordsize: 4k
  thinprovision: "yes"
provisioner: zfs.csi.openebs.io
---
