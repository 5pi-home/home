apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwrt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  rules:
    - host: openwrt.d.42o.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwrt
                port:
                  number: 5080
  tls:
    - hosts:
        - openwrt.d.42o.de
      secretName: openwrt.d.42o.de
