apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude
---
# Long-lived token, filled in by the cluster. Holds no value in here.
apiVersion: v1
kind: Secret
metadata:
  name: claude-token
  annotations:
    kubernetes.io/service-account.name: claude
type: kubernetes.io/service-account-token
---
# kubectl diff needs to read the Secret above, its own token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-token
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [claude-token]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-token
subjects:
  - kind: ServiceAccount
    name: claude
