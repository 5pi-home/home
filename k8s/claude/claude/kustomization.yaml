apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Access for Claude, the AI agent on the host "agent" (repo
# discordianfish/claude-nixos). It reads everything but Secrets and may only
# send dry-run writes, so it can run `kubectl diff -k k8s`. The kubeconfig
# with the token of Secret claude-token is in /etc/nixos-secrets/ there.
resources:
  - serviceaccount.yaml
  - read.yaml
  - dry-run.yaml
