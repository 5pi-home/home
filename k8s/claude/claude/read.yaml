# Read everything except Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-read
rules:
  - apiGroups:
      - ""
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - argoproj.io
      - autoscaling
      - batch
      - cert-manager.io
      - acme.cert-manager.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - imagecontroller.5pi.de
      - metrics.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - storage.k8s.io
      - zfs.openebs.io
      - helm.cattle.io
      - k3s.cattle.io
      - traefik.io
      - traefik.containo.us
      - postgresql.cnpg.io
      - resource.k8s.io
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs:
      - /version
      - /healthz
      - /readyz
      - /livez
      - /openapi
      - /openapi/*
      - /api
      - /api/*
      - /apis
      - /apis/*
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - prometheus:http
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-read
subjects:
  - kind: ServiceAccount
    name: claude
