apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: minecraft
  template:
    metadata:
      annotations:
        prometheus.io/port: "9225"
        prometheus.io/scrape: "true"
      labels:
        name: minecraft
    spec:
      containers:
        - name: minecraft
          image: registry.d.42o.de/minecraft:4d59cf3d56a0e3b979d6de493a2ba47b
          command:
            - /bin/bash
            - -euc
            - |
              mkdir -p plugins
              cp -nrs /paper/plugins/* plugins/ # Symlink all files in /paper/plugins/* to plugins/
              # Metrics exporter: listen on the pod IP for Prometheus (default
              # localhost) and enable the per-player metrics for the Minecraft
              # Players dashboard. The plugin adds defaults for everything else.
              mkdir -p plugins/PrometheusExporter
              printf '%s\n' 'host: 0.0.0.0' 'enable_metrics:' '  player_online: true' '  player_statistic: true' \
                > plugins/PrometheusExporter/config.yml
              echo eula=true > eula.txt
              exec java -Xmx4096M -Xms4096M -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -DbundlerRepoDir=/paper -jar /paper/paper.jar -W /data \
                | sed -u 's#/\(register\|login\).*#/\1 [REDACTED]#'
          ports:
            - containerPort: 25565
          resources:
            requests:
              memory: 4096M
          securityContext:
            runAsUser: 1000
          stdin: true
          tty: true
          volumeMounts:
            - name: minecraft
              mountPath: /data
          workingDir: /data
      volumes:
        - name: minecraft
          persistentVolumeClaim:
            claimName: minecraft
