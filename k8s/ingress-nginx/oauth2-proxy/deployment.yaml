apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      name: oauth2-proxy
  template:
    metadata:
      labels:
        name: oauth2-proxy
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.3.0
          args:
            - --client-id=d57fc7ff4afeeb24fc66
            - --client-secret-file=/etc/oauth2-proxy/client_secret
            - --http-address=0.0.0.0:4180
            - --scope=user:email
            - --provider=github
            - --github-org=5pi-home
            - --email-domain=*
            - --upstream=file:///dev/null
            - --cookie-domain=.d.42o.de
            - --whitelist-domain=.d.42o.de
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: oauth2-proxy-cookie-secret
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
      volumes:
        - name: config
          secret:
            items:
              - key: oauth2-proxy-client-secret
                path: client_secret
            secretName: oauth2-proxy
