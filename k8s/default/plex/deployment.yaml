apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: plex
  template:
    metadata:
      labels:
        name: plex
    spec:
      nodeSelector:
        kubernetes.io/hostname: filer
      hostNetwork: true
      hostname: plex
      containers:
        - name: plex
          image: plexinc/pms-docker:1.41.7.9823-59f304c16
          env:
            - name: TZ
              value: Europe/Berlin
            - name: ADVERTISE_IP
              value: http://plex.d.42o.de:32400/
          ports:
            - containerPort: 32469
            - containerPort: 1900
              protocol: UDP
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32411
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 3005
            - containerPort: 8324
          resources:
            limits:
              memory: 8Gi
          volumeMounts:
            - name: plex
              mountPath: /config
            - name: media
              mountPath: /data
            - name: transcode
              mountPath: /transcode
      volumes:
        - name: plex
          persistentVolumeClaim:
            claimName: plex
        - name: media
          hostPath:
            path: /pool-mirror-hdd/media
        - name: transcode
          emptyDir: {}
