apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      name: minio
  template:
    metadata:
      labels:
        name: minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: filer
      securityContext:
        fsGroup: 1003
        runAsUser: 1003
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-01-20T14-49-07Z
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-password
            - name: MINIO_ROOT_USER
              value: admin
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /pool-mirror-hdd/minio
