apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - service-external.yaml
configMapGenerator:
  - name: mqtt
    files:
      - mosquitto.conf
    options:
      disableNameSuffixHash: true
# Secret "mqtt" (key passwd) is applied by k8s/apply-secrets.
