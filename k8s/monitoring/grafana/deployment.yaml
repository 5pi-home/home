apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/name: grafana
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.4
          env:
            - name: GF_AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: oauth-client-secret
            # Collect garbage harder before hitting the memory limit
            - name: GOMEMLIMIT
              value: 800MiB
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            limits:
              cpu: 200m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /grafana-dashboard-definitions/0
      volumes:
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: grafana
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-apiserver
              - configMap:
                  name: grafana-dashboard-cluster-total
              - configMap:
                  name: grafana-dashboard-controller-manager
              - configMap:
                  name: grafana-dashboard-garden
              - configMap:
                  name: grafana-dashboard-k8s-resources-cluster
              - configMap:
                  name: grafana-dashboard-k8s-resources-namespace
              - configMap:
                  name: grafana-dashboard-k8s-resources-node
              - configMap:
                  name: grafana-dashboard-k8s-resources-nodes-overview
              - configMap:
                  name: grafana-dashboard-k8s-resources-pod
              - configMap:
                  name: grafana-dashboard-k8s-resources-workload
              - configMap:
                  name: grafana-dashboard-k8s-resources-workloads-namespace
              - configMap:
                  name: grafana-dashboard-kubelet
              - configMap:
                  name: grafana-dashboard-minecraft-players
              - configMap:
                  name: grafana-dashboard-minecraft-server
              - configMap:
                  name: grafana-dashboard-namespace-by-pod
              - configMap:
                  name: grafana-dashboard-namespace-by-workload
              - configMap:
                  name: grafana-dashboard-node-cluster-rsrc-use
              - configMap:
                  name: grafana-dashboard-node-rsrc-use
              - configMap:
                  name: grafana-dashboard-nodes
              - configMap:
                  name: grafana-dashboard-persistentvolumesusage
              - configMap:
                  name: grafana-dashboard-pod-total
              - configMap:
                  name: grafana-dashboard-prosafe
              - configMap:
                  name: grafana-dashboard-proxy
              - configMap:
                  name: grafana-dashboard-scheduler
              - configMap:
                  name: grafana-dashboard-smokeping
              - configMap:
                  name: grafana-dashboard-workload-total
