global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/*.rules.yaml
scrape_configs:
  - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    job_name: kube-apiserver
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - action: keep
        regex: default;kubernetes;https
        source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_service_name
          - __meta_kubernetes_endpoint_port_name
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    job_name: kubelet
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      - regex: (.+)
        replacement: /api/v1/nodes/${1}/proxy/metrics
        source_labels:
          - __meta_kubernetes_node_name
        target_label: __metrics_path__
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    metric_relabel_configs:
      # k3s serves the metrics of all its components (apiserver, etcd,
      # scheduler, ...) here too; the kube-apiserver job has them already.
      - action: keep
        regex: (kubelet|kubeproxy|volume_manager|storage_operation|prober|rest_client|process|go)_.+
        source_labels:
          - __name__
  - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    job_name: cadvisor
    kubernetes_sd_configs:
      - role: node
    metric_relabel_configs:
      - action: drop
        regex: container_([a-z_]+);
        source_labels:
          - __name__
          - image
      - action: drop
        regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)
        source_labels:
          - __name__
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      - regex: (.+)
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        source_labels:
          - __meta_kubernetes_node_name
        target_label: __metrics_path__
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        regex: kube-state-metrics
        source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
      - action: replace
        separator: ':'
        source_labels:
          - __meta_kubernetes_pod_name
          - __meta_kubernetes_pod_container_port_name
        target_label: instance
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    job_name: node
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        regex: node-exporter
        source_labels:
          - __meta_kubernetes_pod_label_name
      - action: replace
        source_labels:
          - __meta_kubernetes_pod_node_name
        target_label: instance
      - action: replace
        source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace
      - replacement: ${1}:9100
        source_labels:
          - __address__
        target_label: __address__
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  - job_name: kubernetes-service-endpoints
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - action: keep
        regex: "true"
        source_labels:
          - __meta_kubernetes_service_annotation_prometheus_io_scrape
      - action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
          - __address__
          - __meta_kubernetes_service_annotation_prometheus_io_port
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - action: replace
        source_labels:
          - __meta_kubernetes_namespace
        target_label: kubernetes_namespace
      - action: replace
        source_labels:
          - __meta_kubernetes_service_name
        target_label: kubernetes_name
  - job_name: kubernetes-services
    kubernetes_sd_configs:
      - role: service
    metrics_path: /probe
    params:
      module:
        - http_2xx
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - replacement: blackbox-exporter:9115
        target_label: __address__
      - source_labels:
          - __param_target
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace
      - source_labels:
          - __meta_kubernetes_service_name
        target_label: name
  - job_name: kubernetes-ingresses
    kubernetes_sd_configs:
      - role: ingress
    metrics_path: /probe
    params:
      module:
        - http_2xx
    relabel_configs:
      - action: keep
        regex: "true"
        source_labels:
          - __meta_kubernetes_ingress_annotation_prometheus_io_probe
      - regex: (.+);(.+);(.+);(.*)
        replacement: ${1}://${2}${3}${4}
        source_labels:
          - __meta_kubernetes_ingress_scheme
          - __address__
          - __meta_kubernetes_ingress_path
          - __meta_kubernetes_ingress_annotation_prometheus_io_suffix
        target_label: __param_target
      - replacement: blackbox-exporter:9115
        target_label: __address__
      - source_labels:
          - __param_target
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_ingress_label_(.+)
      - source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace
      - source_labels:
          - __meta_kubernetes_ingress_name
        target_label: name
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: keep
        regex: "true"
        source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        target_label: __address__
      - action: replace
        replacement: $1
        separator: /
        source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_pod_label_name
        target_label: job
      - action: replace
        source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace
      - action: replace
        source_labels:
          - __meta_kubernetes_pod_name
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
        replacement: __param_$1
  - job_name: mouldy
    static_configs:
      - targets:
          - n-office
          - n-bedroom
          - n-garden
  - job_name: wmi
    static_configs:
      - targets:
          - leviathan:9182
  - job_name: nvidia-gpu-exporter
    static_configs:
      - targets:
          - leviathan:9835
  - job_name: blackbox-exporter
    metrics_path: /probe
    params:
      module:
        - http_2xx
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - replacement: blackbox-exporter:9115
        target_label: __address__
    static_configs:
      - targets:
          - https://www.pyur.com/
          - https://google.com/
          - https://5pi.de/
  - job_name: prosafe-exporter
    # The exporter sends no Content-Type, which Prometheus 3 rejects otherwise
    fallback_scrape_protocol: PrometheusText0.0.4
    metrics_path: /probe
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - replacement: prosafe-exporter:9493
        target_label: __address__
    static_configs:
      - targets:
          - sw-core:*
          - sw-office:*
