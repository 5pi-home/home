apiVersion: apps/v1
kind: Deployment
metadata:
  name: prosafe-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      name: prosafe-exporter
  template:
    metadata:
      labels:
        name: prosafe-exporter
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: prosafe-exporter
          image: fish/prosafe_exporter:latest
