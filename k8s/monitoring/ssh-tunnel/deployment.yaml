apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      name: ssh-tunnel
  template:
    metadata:
      labels:
        name: ssh-tunnel
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: ssh-tunnel
          image: kroniak/ssh-client:3.19
          command:
            - ssh
            - -N
            - -T
            - -L0.0.0.0:9100:localhost:9100
            - fish@52.117.41.204
          volumeMounts:
            - name: ssh-tunnel
              mountPath: /root/.ssh
      volumes:
        - name: ssh-tunnel
          secret:
            defaultMode: 384
            secretName: ssh-tunnel
