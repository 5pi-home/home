apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ssh-tunnel
spec:
  rules:
    - host: ssh-tunnel.d.42o.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssh-tunnel
                port:
                  number: 9100
